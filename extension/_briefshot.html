<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;display:flex}iframe{border:0}</style></head><body>
<iframe id="f" src="/extension/_preview.html" width="360" height="860"></iframe>
<script>
const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
const IMG=(c)=>{const cv=document.createElement('canvas');cv.width=120;cv.height=75;const g=cv.getContext('2d');
  g.fillStyle=c;g.fillRect(0,0,120,75);g.fillStyle='#dfe3ea';g.fillRect(9,9,64,8);g.fillRect(9,24,44,7);
  g.fillStyle='#c9432f';g.fillRect(9,40,32,11);return cv.toDataURL('image/jpeg',0.8);};
(async()=>{
  const f=document.getElementById('f');
  for(let i=0;i<60;i++){ if(f.contentDocument?.getElementById('btnStart')&&f.contentWindow?.__emit) break; await sleep(100); }
  const w=f.contentWindow,d=f.contentDocument;const M=w.PERSADO.MSG;
  w.__ctx={frames:[IMG('#eef1f6'),IMG('#f4eee6'),IMG('#eaf1ee')].map(u=>({full:u,thumb:u})),
    elements:[{type:'headline',text:'Banking that actually rewards you',selector:'section:nth-of-type(1) > h1',context:'No monthly fees. No minimum balance.'},
              {type:'cta',text:'Open Your Account',selector:'#hero-cta',context:''}]};
  d.getElementById('btnStart').click(); await sleep(300);
  w.__emit({type:M.SHOTS_UPDATED,thumbs:w.__ctx.frames.map(x=>x.thumb),count:3});
  await sleep(4200);
  d.getElementById('btnStopRec').click(); await sleep(250);
  w.__emit({type:M.TRANSCRIPT_READY,transcript:'Our premier checking hero headline is not converting. The audience is younger professionals opening their first serious account, and we want to cross-sell the high-yield savings account. Signups are well below target so we need to increase them this quarter.'});
  await sleep(1600);
  document.title='READY';
})();
</script></body></html>
