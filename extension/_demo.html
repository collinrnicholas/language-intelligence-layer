<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;font:11px monospace;display:flex;gap:6px}iframe{border:1px solid #ddd}pre{padding:8px;white-space:pre-wrap;max-width:420px}</style></head><body>
<iframe id="f" src="/extension/_preview.html" width="360" height="820"></iframe><pre id="out">running…</pre>
<script>
const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
const T=[];const chk=(n,ok,x='')=>T.push([n,!!ok,x]);
const IMG=(c)=>{const cv=document.createElement('canvas');cv.width=120;cv.height=75;const g=cv.getContext('2d');
  g.fillStyle=c;g.fillRect(0,0,120,75);g.fillStyle='#fff';g.fillRect(9,9,64,8);g.fillRect(9,24,44,7);
  g.fillStyle='#c9432f';g.fillRect(9,40,32,11);return cv.toDataURL('image/jpeg',0.7);};
(async()=>{
 const R={};
 try{
  const f=document.getElementById('f');
  for(let i=0;i<60;i++){ if(f.contentDocument?.getElementById('btnStart')&&f.contentWindow?.__emit) break; await sleep(100); }
  const w=f.contentWindow,d=f.contentDocument;const $=(id)=>d.getElementById(id);const M=w.PERSADO.MSG;
  const NARR='Our premier checking hero headline is not converting. The audience is younger professionals opening their first account and we want to cross-sell high-yield savings. Signups are below target so we need to increase them.';

  chk('DEMO_MODE off by default',w.PERSADO_CONFIG.DEMO_MODE===false,String(w.PERSADO_CONFIG.DEMO_MODE));
  chk('demo chip hidden when off',w.getComputedStyle($('demoFlag')).display==='none');
  chk('start-screen marketing stat gone',!d.querySelector('.stat')&&!/40%/.test($('panelConfigure').textContent),$('panelConfigure').textContent.match(/40%/)?'still there':'gone');

  w.__ctx={frames:[IMG('#2b3245'),IMG('#4a3b22'),IMG('#22403a')].map(u=>({full:u,thumb:u})),
    elements:[{type:'headline',text:'Banking that actually rewards you',selector:'body > section:nth-of-type(1) > h1',context:'No monthly fees'},
              {type:'cta',text:'Open Your Account',selector:'#hero-cta',context:''}]};
  $('btnStart').click(); await sleep(300);
  w.__emit({type:M.SHOTS_UPDATED,thumbs:w.__ctx.frames.map(f=>f.thumb),count:3});
  await sleep(2600);                       // let the real timer accumulate
  $('btnStopRec').click(); await sleep(250);
  w.__emit({type:M.TRANSCRIPT_READY,transcript:NARR});
  await sleep(1500);

  // ── landed on the Brief view
  chk('lands on the Brief view, not results',$('panelBrief').classList.contains('active'),[...d.querySelectorAll('.panel.active')].map(p=>p.id).join());
  chk('brief subtitle has real duration + screens',/^Captured in [0-9]+:[0-9][0-9] . 3 screens . 3 sent to the model$/.test($('briefSub').textContent),$('briefSub').textContent);
  const ftxt=$('briefFields').textContent;
  chk('brief shows the page URL',/northstarbank\.com\/checking\/premier/.test(ftxt));
  chk('brief shows the extracted element + selector + copy',/headline/.test(ftxt)&&/h1/.test(ftxt)&&/Banking that actually rewards you/.test(ftxt),ftxt.slice(0,120));
  chk('brief shows product line + objective',/Retail Banking/.test(ftxt)&&/cross-sell/.test(ftxt));
  chk('brief shows the narration verbatim',$('briefNarration').textContent.includes('younger professionals'));
  chk('brief shows screenshot thumbnails',d.querySelectorAll('#briefShots img').length===3);
  chk('newest thumb is marked',!!d.querySelector('#briefShots img.newest'));

  // ── coverage
  const cov=$('briefCoverage');
  chk('coverage component visible',cov.style.display!=='none');
  chk('coverage shows 4 items',cov.querySelectorAll('.cov').length===4,String(cov.querySelectorAll('.cov').length));
  chk('complete brief scores 4 of 4',/4 of 4/.test(cov.textContent),cov.querySelector('.sec-label').textContent);
  chk('covered rows are green',w.getComputedStyle(cov.querySelector('.cov.yes .cov-i')).backgroundColor==='rgb(16, 185, 129)');
  chk('no Add buttons when complete',cov.querySelectorAll('.cov-add').length===0);

  // ── JSON copy reflects the real payload
  const sentBody=w.__sent.filter(x=>x.fetch&&x.fetch.includes('recommend')).pop()?.body;
  chk('payload was actually sent',!!sentBody);
  chk('payload element is the extracted headline',sentBody?.element?.text==='Banking that actually rewards you',JSON.stringify(sentBody?.element?.text));
  chk('payload carries images',Array.isArray(sentBody?.images)&&sentBody.images.length===3,String(sentBody?.images?.length));

  // ── results
  $('btnBriefContinue').click(); await sleep(300);
  chk('See variants reaches results',$('panelResults').classList.contains('active'));
  chk('completion line uses the real duration',/^Brief captured in [0-9]+:[0-9][0-9] . 1 click . 0 email threads$/.test($('capLine').textContent),$('capLine').textContent);
  const card=d.querySelector('.rec-card');
  chk('card shows Current on-page copy',/Current/.test(card.textContent)&&/Banking that actually rewards you/.test(card.textContent));
  chk('current copy is struck through',w.getComputedStyle(card.querySelector('.rc-t')).textDecorationLine==='line-through');
  chk('no lift number displayed',!/\+8–14%|\+12–20%/.test(d.getElementById('resultsContainer').textContent),d.getElementById('resultsContainer').textContent.match(/\+\d+–\d+%/)?'lift shown':'none');
  chk('empty Motivation AI seam shown',/Motivation AI score — not connected/.test(card.textContent));
  chk('seam is muted with a dashed border',w.getComputedStyle(card.querySelector('.badge.seam')).borderStyle==='dashed');
  chk('compliance badge has no emoji',/Compliance: clear/.test(card.textContent)&&!/✓|📈/.test(card.textContent));
  chk('Brief button returns to the brief',!!$('btnBackToBrief'));
  $('btnBackToBrief').click(); await sleep(200);
  chk('back to brief works',$('panelBrief').classList.contains('active'));

  // ── gaps: a vague brief must show Add affordances, not four ticks
  w.__emit({type:M.TRANSCRIPT_READY,transcript:'I dunno it just feels wrong and kind of bad honestly, make it nicer.'});
  await sleep(1200);
  const cov2=$('briefCoverage');
  chk('vague brief is not 4 of 4',!/4 of 4/.test(cov2.textContent),cov2.querySelector('.sec-label')?.textContent);
  chk('missing items offer Add',cov2.querySelectorAll('.cov-add').length>0,String(cov2.querySelectorAll('.cov-add').length));
  cov2.querySelector('.cov-add').click(); await sleep(150);
  chk('Add opens an inline filler',!!cov2.querySelector('.covfill textarea'));
  cov2.querySelector('.covfill textarea').value='The audience is existing checking customers who are affluent savers.';
  cov2.querySelector('[data-save]').click(); await sleep(300);
  chk('adding text re-evaluates coverage',/of 4/.test(cov2.textContent)&&cov2.querySelectorAll('.cov.yes').length>=1,cov2.querySelector('.sec-label')?.textContent);
  chk('added text is in the narration',/affluent savers/.test($('briefNarration').textContent));
  R.ok=true;
 }catch(e){R.error=String(e&&e.stack||e);}
 const pass=T.filter(t=>t[1]).length;
 R.summary=pass+'/'+T.length;R.failures=T.filter(t=>!t[1]).map(t=>t[0]+(t[2]?'  ['+t[2]+']':''));
 document.getElementById('out').textContent=JSON.stringify(R,null,1);
 document.title='DONE';
})();
</script></body></html>
